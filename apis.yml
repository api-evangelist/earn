aid: earn
name: Earn
description: >-
  Earn.com (formerly 21 Inc / 21.co) was a cryptocurrency startup that let people
  earn Bitcoin by replying to paid messages and completing microtasks, effectively
  a paid-email and paid-task marketplace settled in crypto. Founded by Balaji
  Srinivasan and backed by DCVC among others, the company was acquired by Coinbase
  in April 2018 (Coinbase, ticker COIN) and folded into the Coinbase Earn product.
  The independent earn.com property no longer operates a standalone product or
  developer surface: earn.com now issues a 301 redirect to coinbase.com/earn, and
  earlier hosts such as 21.co and api.earn.com no longer resolve. This profile is
  retained in the API Evangelist network as an acquired-company record; there is no
  independent, first-party API, developer portal, or OpenAPI to enrich.
